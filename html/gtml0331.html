<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      div {
        background-color: rgb(105, 128, 0);
        margin: 5px;
      }

      .hello {
        background-color: rgb(251, 252, 250);
        display: none;
      }

      #close {
        float: right;
        margin-right: 10px;
      }

      button {
        background-color: rgb(243, 39, 12);
      }
    </style>

  </head>
  <body>
    <div id="hello"></div>
    <button id="clicker">누르기</button>
  
    <script>
      document.getElementById("clicker").addEventListener("click", function() {
        onView(true);
      });
  
      function onView(isOn) {
        if (!isOn) return;
  
        let tagArea = document.getElementById("hello");
  
        // 1. 새로운 div 한 줄 생성
        let newBox = document.createElement("div");
        newBox.style.marginBottom = "5px"; // 줄 간격 살짝 띄우기
  
        // 2. 텍스트 추가
        let textSpan = document.createElement("span");
        textSpan.innerHTML = "홀리 ! 유 슈드 체크 인 온 섬 오브 더즈 필드 빌로우. ";
        
        // 3. X 버튼 추가
        let closeBtn = document.createElement("button");
        closeBtn.innerHTML = "X";
        
        // 4. X 버튼 클릭 시 해당 줄 삭제 기능
        closeBtn.onclick = function() {
          newBox.remove();
        };
  
        // 5. 조립 후 화면에 추가
        newBox.appendChild(textSpan);
        newBox.appendChild(closeBtn);
        tagArea.appendChild(newBox);
      }
    </script>
  </body>
</html>
